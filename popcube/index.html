<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>PopCube</title>
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f9bff">
<meta name="description" content="Drop colorful blocks, pop full rows and columns, and build huge streaks.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>

<div class="bgfx" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="bar">
    <div class="left">
      <div class="mark">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <rect x="1" y="1" width="11" height="11" rx="3" fill="#ff4d6d"/><rect x="14" y="1" width="11" height="11" rx="3" fill="#ffc531"/>
          <rect x="1" y="14" width="11" height="11" rx="3" fill="#2ecc71"/><rect x="14" y="14" width="11" height="11" rx="3" fill="#a66cff"/>
          <ellipse cx="5" cy="4" rx="2.6" ry="1.4" fill="#fff" opacity=".7"/><ellipse cx="18" cy="4" rx="2.6" ry="1.4" fill="#fff" opacity=".7"/>
          <ellipse cx="5" cy="17" rx="2.6" ry="1.4" fill="#fff" opacity=".7"/><ellipse cx="18" cy="17" rx="2.6" ry="1.4" fill="#fff" opacity=".7"/>
        </svg>
        <span class="name">PopCube</span>
      </div>
      <button class="chip coins" id="shardBtn" type="button"><svg class="coin-ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#ffc531" stroke="#d99100" stroke-width="1.4"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="#d99100" stroke-width="1"/><path d="M5.4 5.6a3.3 3.3 0 0 1 2.3-1.3" stroke="#fff6d1" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><span id="shardCt">0</span></button>
    </div>
    <div class="tools">
      <button class="chip" id="modeBtn" type="button"><span id="modeName">Classic</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="menuBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
        <span class="dot" id="menuDot" hidden></span>
      </button>
      <button class="icon-btn" id="restartBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <section class="scoreboard" aria-live="polite">
    <div class="top" id="top"></div>
    <div class="score" id="score">0</div>
    <div class="goal" id="goal" hidden><i id="goalFill"></i></div>
    <div class="sub" id="sub"></div>
  </section>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" role="grid"></div>
    <div class="fx" id="fx"></div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-labelledby="sheetTitle">
        <p class="eyebrow" id="sheetEyebrow"></p>
        <h2 id="sheetTitle"></h2>
        <div class="stars" id="sheetStars" hidden></div>
        <p class="txt" id="sheetText" hidden></p>
        <div class="sheet-score" id="sheetScore"><span id="finalScore">0</span><small id="finalBest"></small></div>
        <div class="extras" id="sheetExtras" hidden></div>
        <div class="sheet-actions" id="sheetActions"></div>
      </div>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="toolrow">
      <button class="tool" type="button" data-tool="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl"></span><span class="ct">0</span></button>
      <button class="tool" type="button" data-tool="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="lbl"></span><span class="ct">0</span></button>
      <button class="tool" type="button" data-tool="hammer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 12-8.5 8.5a2.1 2.1 0 1 1-3-3L12 9"/><path d="M17.6 15 22 10.6"/><path d="m20.9 11.7-1.2-1.2c-.6-.6-1-1.4-1-2.3v-.8L16 4.6A5.6 5.6 0 0 0 12 3H9l.9.8A6.2 6.2 0 0 1 12 8.4V10l2 2h2.5l2.3 1.9"/></svg><span class="lbl"></span><span class="ct">0</span></button>
      <button class="tool" type="button" data-tool="reroll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg><span class="lbl"></span><span class="ct">0</span></button>
      <button class="tool" type="button" data-tool="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="lbl"></span><span class="ct cost"></span></button>
    </div>
    <div class="meter"><span id="meterLbl"></span><div class="track"><i id="meterFill"></i></div><span id="meterTxt"></span></div>
  </div>

  <div class="tray" id="tray">
    <button class="slot" type="button" data-i="0"></button>
    <button class="slot" type="button" data-i="1"></button>
    <button class="slot" type="button" data-i="2"></button>
  </div>

  <p class="hint" id="hint"></p>
</div>

<div class="panel-back" id="panel" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head">
      <div class="row1">
        <h2 id="panelTitle"></h2>
        <button class="icon-btn" id="panelClose" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="tabs" id="tabs" role="tablist" hidden></div>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
